<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>

<body>

<h1 style="margin-top: 20px;">Admin – Einträge verwalten</h1>

{% include "sidebar.html" %}

<div id="mobileCards" class="card-list"></div>
<input id="search" placeholder="Suchen…" class="suche">


<table>
    <tbody id="tbody">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Wert</th>
            <th>Aktionen</th>
        </tr>

        {% for id, name, wert in daten %}
        <tr>
            <td>{{ id }}</td>
            <td>{{ name }}</td>
            <td>{{ wert }}</td>
            <td>
                <a href="/edit/{{ id }}">Bearbeiten</a> |
                <a class="delete" href="/delete/{{ id }}" onclick="return confirm('Eintrag wirklich löschen?')">Löschen</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div style="margin-top: 30px;">
    <a href="/admin/log" class="export-button">log</a>
    <br><br>
    <a href="/export/excel" class="export-button"> Excel exportieren</a>
</div>



<a href="/delete_all"
   onclick="return confirm('Wirklich ALLE Einträge löschen?')"
   style="color:#ff7675; font-size:24px; font-weight:bold;">
     Alle löschen
</a>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script src="/static/js/admin.js"> </script>
<script src="/static/js/main.js"> </script>
</body>
</html>
