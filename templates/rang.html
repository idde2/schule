<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rangliste</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/rang.css">
</head>

<body>


{% include "sidebar.html" %}



<h1 style="font-size: 50px">Rangliste</h1>

<div id="mobileCards" class="card-list"></div>


<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Wert</th>
        </tr>
    </thead>
    <tbody id="tbody">
        {% for name, wert in daten %}
        <tr class="
            {% if loop.index == 1 %}top1{% endif %}
            {% if loop.index == 2 %}top2{% endif %}
            {% if loop.index == 3 %}top3{% endif %}
        ">
            <td>{{ name }}</td>
            <td>{{ wert }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script src="/static/js/rang.js"> </script>
<script src="/static/js/main.js"> </script>
</body>
</html>
