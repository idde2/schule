<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Neuen Wert eingeben</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/eingabe.css">
</head>

<body>

{% include "sidebar.html" %}

<div class="form-container">
    <h1>Neue Werte eingeben</h1>

    <form method="POST">
        <label for="name">Name:</label>
        <input id="name" name="name" type="text" required>

        <label for="wert">Wert:</label>
        <input id="wert" name="wert" type="number" step="0.01" maxlength="10" required>

        <button class="button2" type="submit">Speichern</button>
    </form>
</div>

<script id="namenData" type="application/json">
    {{ namen|tojson }}
</script>

<script src="/static/js/eingabe.js"> </script>
<script src="/static/js/main.js"> </script>
</body>
</html>
